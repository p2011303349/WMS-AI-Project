<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI智能助手 - WMS</title>
    <link rel="stylesheet" href="/css/wms.css">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .message {
            margin-bottom: 16px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message.assistant {
            justify-content: flex-start;
        }
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }
        .user .message-content {
            background: #1890ff;
            color: white;
        }
        .assistant .message-content {
            background: #f0f2f5;
            color: #333;
        }
        .chat-input {
            display: flex;
            padding: 16px;
            border-top: 1px solid #e8e8e8;
            gap: 12px;
        }
        .chat-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            font-size: 14px;
        }
        .chat-input button {
            padding: 10px 24px;
        }
        .typing {
            color: #999;
            font-style: italic;
        }
        .suggestions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .suggestion-btn {
            padding: 4px 12px;
            background: #f0f2f5;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-size: 12px;
        }
        .suggestion-btn:hover {
            background: #e6f7ff;
            color: #1890ff;
        }
    </style>
</head>
<body>
<div class="header">
    <h2>🤖 WMS AI智能助手</h2>
    <div class="header-info">
        <span>租户: <span id="tenantCode">-</span></span>
        <span>用户: <span id="username">-</span></span>
        <button class="logout-btn" onclick="logout()">退出登录</button>
    </div>
</div>

<div class="app-container">
    <div class="sidebar">
        <a href="/index.html" class="active">📊 仪表盘</a>
        <a href="/inbound.html">📥 入库管理</a>
        <a href="/outbound.html">📤 出库管理</a>
        <a href="/inventory.html">📦 库存查询</a>
        <a href="/iot-dashboard.html">📈 IoT仪表盘</a>
        <a href="/ai-chat.html">🤖 AI聊天</a>
        <a href="/ai-agent.html">🔧 AI智能体</a>
        <a href="/replenishment.html" class="active">📝 智能补货</a>
        <a href="/exception.html">⚠️ 异常管理</a>
        <a href="/workflow.html" class="active">🔄 工作流</a>
    </div>

    <div class="main-content">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="message assistant">
                    <div class="message-content">
                        👋 你好！我是WMS智能助手。<br>
                        我可以帮你：<br>
                        • 查询库存（如："SKU001还剩多少库存？"）<br>
                        • 了解入库/出库流程<br>
                        • 生成补货建议<br>
                        • 解答仓储管理问题<br><br>
                        请问有什么可以帮助你的？
                    </div>
                </div>
            </div>
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="输入你的问题..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="sendMessage()">发送</button>
            </div>
            <div class="suggestions" id="suggestions">
                <button class="suggestion-btn" onclick="quickQuestion('SKU001还剩多少库存？')">📦 SKU001库存</button>
                <button class="suggestion-btn" onclick="quickQuestion('怎么创建入库单？')">📥 入库流程</button>
                <button class="suggestion-btn" onclick="quickQuestion('低库存商品有哪些？')">⚠️ 低库存查询</button>
                <button class="suggestion-btn" onclick="quickQuestion('生成补货建议')">🔄 补货建议</button>
            </div>
        </div>
    </div>
</div>

<script src="/js/common.js"></script>
<script>
    let isTyping = false;

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        if (!message) return;

        // 添加用户消息
        addMessage(message, 'user');
        input.value = '';

        // 显示输入中状态
        showTyping();

        try {
            const response = await request('/api/ai/chat', {
                method: 'POST',
                body: JSON.stringify({ question: message })
            });
            const data = await response.json();
            hideTyping();
            addMessage(data.answer, 'assistant');
        } catch (err) {
            hideTyping();
            addMessage('抱歉，处理你的问题时出错了：' + err.message, 'assistant');
        }
    }

    function addMessage(text, role) {
        const messagesDiv = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        messageDiv.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
        if (isTyping) return;
        isTyping = true;
        const messagesDiv = document.getElementById('chatMessages');
        const typingDiv = document.createElement('div');
        typingDiv.className = 'message assistant';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<div class="message-content typing">正在思考...</div>';
        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
        isTyping = false;
    }

    function quickQuestion(question) {
        document.getElementById('messageInput').value = question;
        sendMessage();
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 初始化
    checkAuth();
    document.getElementById('tenantCode').textContent = getTenantCode();
    const token = getToken();
    if (token) {
        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            document.getElementById('username').textContent = payload.username || 'admin';
        } catch(e) {}
    }
</script>
</body>
</html>
